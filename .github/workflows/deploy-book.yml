name: deploy-book

on:
  push:
    branches: [main]
    paths: ["tutorial/**", ".github/workflows/deploy-book.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Notebooks are committed with executed outputs, so the build
      # only renders them — no JAX needed here.
      - run: pip install "jupyter-book~=1.0"
      - run: jupyter-book build tutorial/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tutorial/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
