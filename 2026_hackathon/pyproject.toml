[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fairjax"
version = "0.1.0"
description = "The FaIR simple climate model in JAX, end-to-end differentiable"
requires-python = ">=3.10"
dependencies = ["jax", "numpy"]

[project.optional-dependencies]
# `fair` itself is only needed to build configurations and to validate the port
reference = ["fair==2.2.4", "pandas", "xarray", "pooch"]
dev = ["pytest", "matplotlib", "optax", "numpyro"]
# only needed to re-run scripts/stage_cesm.py; the staged data is committed,
# so hackathon participants do not need these
staging = ["gcsfs", "zarr", "intake-esm"]

[tool.setuptools]
packages = ["fairjax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
